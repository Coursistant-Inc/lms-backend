openapi: 3.0.1
info:
  description: Coursistant LMS REST API contract (OpenAPI 3).
  title: LMS API
  version: 1.0.0
servers:
- description: Servlet context-path
  url: /api
security:
- bearerAuth: []
tags:
- description: Current-user enrolled courses
  name: MeCourses
- description: "Course membership: students, TAs, members, admin enroll"
  name: Enrollment
- description: Course syllabus metadata and file stream
  name: Syllabus
- description: "Group sets, groups, and membership"
  name: Groups
- description: Course announcements
  name: Announcements
- description: Course schedule sessions
  name: Sessions
- description: "Week materials: files, links, preview/download"
  name: Materials
- description: Course calendar events
  name: Events
- description: Current-user upcoming course activities
  name: MeEvents
- description: "Course lifecycle, archive, and primary instructor"
  name: Courses
- description: Current-user recent announcements across courses
  name: MeAnnouncements
- description: Instructor/TA teaching dashboard
  name: Teaching
- description: Course content weeks and zip download
  name: Weeks
paths:
  /v2/admin/courses/{courseId}/enrollments:
    post:
      operationId: adminEnrollmentEnroll
      parameters:
      - description: Optional idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEnrollRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: System-admin enroll a student (legacy path)
      tags:
      - Enrollment
  /v2/admin/courses/{courseId}/enrollments/batch:
