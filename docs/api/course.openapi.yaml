components:
  schemas:
    AdminBatchEnrollRequest:
      type: object
      description: Batch enroll students by userIds and/or emails
      properties:
        emails:
          type: array
          items:
            type: string
        userIds:
          type: array
          items:
            type: integer
            format: int32
    AdminEnrollRequest:
      type: object
      description: Enroll a single user by userId (student or TA)
      properties:
        userId:
          type: integer
          format: int32
    ApiResponse:
      type: object
      description: Unified JSON envelope for LMS APIs
      properties:
        code:
          type: string
          description: Stable machine code (ErrorType.name() or SUCCESS)
          example: SUCCESS
        data:
          type: array
          description: Payload; omitted or null on many errors
          items:
            $ref: "#/components/schemas/MaterialResponse"
        message:
          type: string
          description: Human-readable message
          example: Success
        status:
          type: integer
          format: int32
          description: HTTP status mirrored in body
          example: 200
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp
          example: 2026-07-23T10:00:00Z
    AssignMemberRequest:
      type: object
      properties:
        confirmAcademicImpact:
          type: boolean
        confirmCapacityOverfill:
          type: boolean
        userId:
          type: integer
          format: int32
    BatchCreateGroupsRequest:
      type: object
      properties:
        count:
          type: integer
          format: int32
        namePrefix:
          type: string
    CreateAnnouncementRequest:
      type: object
      properties:
        body:
          type: string
        title:
          type: string
    CreateCourseEventRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        endTime:
          $ref: "#/components/schemas/LocalTime"
        location:
          type: string
        name:
          type: string
        startTime:
          $ref: "#/components/schemas/LocalTime"
    CreateCourseRequest:
      type: object
      description: Create a new course
      properties:
        courseCode:
          type: string
        description:
          type: string
        instructorId:
          type: integer
          format: int32
        location:
          type: string
        primaryInstructorUserId:
          type: integer
          format: int32
        tenantId:
          type: integer
          format: int32
        termEndDate:
          type: string
          format: date
        termStartDate:
          type: string
          format: date
        title:
          type: string
    CreateGroupRequest:
      type: object
      properties:
        capacityOverride:
          type: integer
          format: int32
        name:
          type: string
    CreateGroupSetRequest:
      type: object
      description: Create a course group set
      properties:
        defaultCapacity:
          type: integer
          format: int32
        joinClosesAt:
          type: string
          format: date-time
        joinOpensAt:
          type: string
          format: date-time
        locked:
          type: boolean
        name:
          type: string
    CreateSessionRequest:
      type: object
      properties:
        dayOfWeek:
          type: string
        endTime:
          $ref: "#/components/schemas/LocalTime"
        location:
          type: string
        startTime:
          $ref: "#/components/schemas/LocalTime"
        type:
          type: string
    CreateWeekRequest:
      type: object
      properties:
        title:
          type: string
    LocalTime:
      type: object
      properties:
        hour:
          type: integer
          format: int32
        minute:
          type: integer
          format: int32
        nano:
          type: integer
          format: int32
        second:
          type: integer
          format: int32
    MaterialCreateRequest:
      type: object
      description: "Multipart form: upload files and/or create an external link material"
      properties:
        files:
          type: array
          description: One or more files (materialType=FILE)
          items:
            type: string
            format: binary
        linkDisplayName:
          type: string
          description: Display name when creating a link material
          example: Week 1 reading
        linkUrl:
          type: string
          description: External URL for a link material (materialType=LINK)
          example: https://example.com/reading
    MaterialResponse:
      type: object
      description: Week material (file or link)
      properties:
        contentType:
          type: string
        courseId:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
        downloadUrl:
          type: string
        extension:
          type: string
        id:
          type: integer
          format: int32
        linkUrl:
          type: string
        materialType:
          type: string
        orderPosition:
          type: integer
          format: int32
        originalFilename:
          type: string
        previewAvailable:
          type: boolean
        previewUrl:
          type: string
        sizeBytes:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
        uploadedBy:
          type: integer
          format: int32
        weekId:
          type: integer
          format: int32
    MoveMaterialRequest:
      type: object
      properties:
        targetWeekId:
          type: integer
          format: int32
    MoveMemberRequest:
      type: object
      properties:
        confirmAcademicImpact:
          type: boolean
        confirmCapacityOverfill:
          type: boolean
        targetGroupId:
          type: integer
          format: int32
    PatchCourseRequest:
      type: object
      description: Partial course update; only non-null whitelist fields are applied
      properties:
        clearDescription:
          type: boolean
        clearLocation:
          type: boolean
        courseCode:
          type: string
        description:
          type: string
        instructorId:
          type: integer
          format: int32
        location:
          type: string
        primaryInstructorUserId:
          type: integer
          format: int32
        tenantId:
          type: integer
          format: int32
        termEndDate:
          type: string
          format: date
        termStartDate:
          type: string
          format: date
        title:
          type: string
    PatchGroupRequest:
      type: object
      properties:
        capacityOverride:
          type: integer
          format: int32
        clearCapacityOverride:
          type: boolean
        confirmCapacityShorten:
          type: boolean
        name:
          type: string
    PatchGroupSetRequest:
      type: object
      properties:
        clearJoinClosesAt:
          type: boolean
        clearJoinOpensAt:
          type: boolean
        confirmCapacityShorten:
          type: boolean
        confirmWindowShorten:
          type: boolean
        defaultCapacity:
          type: integer
          format: int32
        joinClosesAt:
          type: string
          format: date-time
        joinOpensAt:
          type: string
          format: date-time
        locked:
          type: boolean
        name:
          type: string
    ReassignPrimaryInstructorRequest:
      type: object
      properties:
        primaryInstructorUserId:
          type: integer
          format: int32
    RenameMaterialRequest:
      type: object
      properties:
        displayName:
          type: string
    RenameWeekRequest:
      type: object
      properties:
        title:
          type: string
    ReorderMaterialsRequest:
      type: object
      properties:
        materialIds:
          type: array
          items:
            type: integer
            format: int32
    ReorderWeeksRequest:
      type: object
      properties:
        weekIds:
          type: array
          items:
            type: integer
            format: int32
    SwitchGroupRequest:
      type: object
      properties:
        targetGroupId:
          type: integer
          format: int32
    UpdateAnnouncementRequest:
      type: object
      properties:
        body:
          type: string
        title:
          type: string
    UpdateCourseEventRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        endTime:
          $ref: "#/components/schemas/LocalTime"
        location:
          type: string
        name:
          type: string
        startTime:
          $ref: "#/components/schemas/LocalTime"
    UpdateSessionRequest:
      type: object
      properties:
        dayOfWeek:
          type: string
        endTime:
          $ref: "#/components/schemas/LocalTime"
        location:
          type: string
        startTime:
          $ref: "#/components/schemas/LocalTime"
        type:
          type: string
    UpdateTaPermissionsRequest:
      type: object
      properties:
        canGrade:
          type: boolean
        canManageCourseEvents:
          type: boolean
        canManageGroups:
          type: boolean
        canPostAnnouncements:
          type: boolean
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "Access token from POST /v1/auth/login (Authorization: Bearer <token>)."
      name: bearerAuth
      scheme: bearer
      type: http
