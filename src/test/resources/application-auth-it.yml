# Auth integration profile — container URLs injected by AuthIntegrationTestBase.
# Never point this file at the developer lms_v2 database.

spring:
  main:
    allow-bean-definition-overriding: true
  task:
    scheduling:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  mail:
    host: localhost
    port: 25
    username: test
    password: test

server:
  servlet:
    context-path: /api

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.coursistant.lms.module
  configuration:
    map-underscore-to-camel-case: true

token:
  access-expire-hours: 2
  refresh-expire-days: 14
  refresh-rotation-grace-seconds: 5
  private-key-path: classpath:test-private.pem
  public-key-path: classpath:test-public.pem

auth:
  docs-public: false
  jwt:
    issuer: https://usc.xlearnedu.com
    audience: com.coursistant.lms
    min-issued-at:
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*

aws:
  s3:
    enabled: true
    region: us-west-2
    bucket: auth-it-placeholder

REDIS_DEFAULT_PASSWORD:

logging:
  level:
    root: WARN
    com.coursistant.lms: INFO
