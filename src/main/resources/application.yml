server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework
  servlet:
      context-path: /api
      encoding:
        enabled: false



  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher


# Spring core configuration
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://localhost:3306/lms_v2?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true

    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 10000
      leak-detection-threshold: 30000

  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
  hadoop:
    fs:
      defaultFS: hdfs://labserver101.ddns.net:9666 # HDFS ??? (??????Hadoop ????)
      user: admir  # ?? HDFS ????
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  
  mail:
    host: mail.privateemail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 20000
          writetimeout: 20000



# MyBatis mapper locations
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.coursistant.lms.module
  configuration:
    # Use slf4j so scheduled empty polls are not dumped to stdout.
    # Enable SQL with: logging.level.com.coursistant.lms.module.<mapper>=DEBUG
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

mail:
  host: mail.privateemail.com
  port: 587
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# PageHelper
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# S3 is required. enabled=false or a blank region/bucket fails startup.
# Credentials come from DefaultCredentialsProvider (process env / ~/.aws), not these keys.
aws:
  s3:
    enabled: ${AWS_S3_ENABLED:true}
    region: ${AWS_S3_REGION:us-west-2}
    bucket: ${AWS_S3_BUCKET:}
    endpoint-override: ${AWS_S3_ENDPOINT:}

lms:
  idempotency:
    pending-ttl-seconds: 900
  content:
    max-file-bytes: 209715200
  notification:
    outbox:
      enabled: true
      poll-ms: 5000
      batch-size: 100
      max-attempts: 8
      recipient-insert-chunk: 500
      lease-seconds: 120
    digest:
      default-time-zone: America/Los_Angeles
      batch-size: 200
      lease-seconds: 120
      max-attempts: 5
    email:
      enabled: true
      provider: ${LMS_NOTIFICATION_EMAIL_PROVIDER:log}
      from-address: ${MAIL_USERNAME:do.not.reply@coursistant.com}
      from-name: xLearn
      base-url: ${APP_BASE_URL:https://dev.xlearnedu.com}
      max-attempts: 5
      backoff-base-seconds: 2
      poll-ms: 5000
      batch-size: 50
      lease-seconds: 120

ip: localhost

api:
  base:
    url: ${API_BASE_URL}


token:
  access-expire-hours: 2
  refresh-expire-days: 14
  refresh-rotation-grace-seconds: 30
  private-key-path: private.pem
  public-key-path: public.pem

# Role cutover: set AUTH_JWT_MIN_ISSUED_AT to an ISO-8601 Instant (e.g. 2026-07-28T12:00:00Z)
# so all Access Tokens issued before that moment are rejected. Rotate private.pem/public.pem
# at the same maintenance window and keep the new keys on rollback.
# AUTH_DOCS_PUBLIC=false in production to close swagger.
auth:
  docs-public: ${AUTH_DOCS_PUBLIC:true}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://usc.xlearnedu.com}
    audience: ${AUTH_JWT_AUDIENCE:com.coursistant.lms}
    min-issued-at: ${AUTH_JWT_MIN_ISSUED_AT:}
  cors:
    # TEMP FE integration: any localhost / 127.0.0.1 port (keeps credentials/Cookie).
    # Before production, switch to explicit origins, e.g. http://localhost:5173 only.
    # Override: AUTH_CORS_ALLOWED_ORIGIN_PATTERNS
    allowed-origin-patterns: ${AUTH_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

