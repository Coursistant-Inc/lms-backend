server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework
  servlet:
      context-path: /api
      encoding:
        enabled: false



  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher


# 数据库配置
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://localhost:3306/lms_v2?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true

    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 10000
      leak-detection-threshold: 30000

  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
  hadoop:
    fs:
      defaultFS: hdfs://labserver101.ddns.net:9666 # HDFS 的地址 (替换为你的 Hadoop 集群地址)
      user: admir  # 访问 HDFS 的用户

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  
  mail:
    host: mail.privateemail.com  # 你的邮件服务器
    port: 587
    username: ${MAIL_USERNAME}  # 你的邮箱
    password: ${MAIL_PASSWORD}  # 你的邮箱授权码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true



# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.coursistant.lms.module
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

mail:
    host: mail.privateemail.com  # 你的邮件服务器
    port: 587
    username: ${MAIL_USERNAME}  # 你的邮箱
    password: ${MAIL_PASSWORD}  # 你的邮箱授权码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 分页
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

minio:
  url: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

lms:
  content:
    max-file-bytes: 209715200

ip: localhost

api:
  base:
    url: ${API_BASE_URL}


token:
  access-expire-hours: 2
  refresh-expire-days: 14
  private-key-path: private.pem
  public-key-path: public.pem

